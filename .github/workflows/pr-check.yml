name: PR Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high

  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: i18n consistency check
        run: npm run check:i18n

      - name: Unit tests with coverage
        run: npm run test:coverage -- --coverage.reporter=text-summary --coverage.reporter=json-summary

      - name: Comment coverage report on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = 'coverage/coverage-summary.json';
            if (!fs.existsSync(path)) {
              core.setFailed(`Coverage summary not found at ${path}`);
              return;
            }

            const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
            const total = summary.total;
            const fmt = (metric) => `${metric.pct}% (${metric.covered}/${metric.total})`;

            const body = [
              '## Test Coverage Report',
              '',
              '| Metric | Coverage |',
              '|---|---:|',
              `| Lines | ${fmt(total.lines)} |`,
              `| Statements | ${fmt(total.statements)} |`,
              `| Functions | ${fmt(total.functions)} |`,
              `| Branches | ${fmt(total.branches)} |`,
            ].join('\n');

            const marker = '<!-- coverage-report -->';
            const commentBody = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: commentBody,
              });
            }

      - name: Build
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: https://example.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

      - name: Astro check
        run: npm run astro -- check
        env:
          PUBLIC_SUPABASE_URL: https://example.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
