name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - supabase/functions/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: true

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SUPABASE_ACCESS_TOKEN: op://swing-dance-moves/Supabase/access-token
          SUPABASE_PROJECT_REF: op://swing-dance-moves/Supabase/project-ref

      - name: Verify required Supabase env vars
        run: |
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          [[ -n "$SUPABASE_PROJECT_REF" ]] || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy confirm-registration
        run: supabase functions deploy confirm-registration --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy register
        run: supabase functions deploy register --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy admin-register
        run: supabase functions deploy admin-register --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy admin-backup
        run: supabase functions deploy admin-backup --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy admin-restore
        run: supabase functions deploy admin-restore --project-ref "$SUPABASE_PROJECT_REF"
